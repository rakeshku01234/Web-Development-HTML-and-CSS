<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form> 
<h1>Registration Form</h1>
<p> Name:<input type="text" placeholder="name" id=""></p>
<p> Email:<input type="text" placeholder=" Email" id=""></p>
<p>Roll no.<input type="number" placeholder="Roll no" id=""></p>

<p>Confirm Password: <input type="password" placeholder="confirm password" id="" ></p> 
<p> Collage Name:<input type="text" placeholder="Collage" id=""></p>

    <option> India +91 </option>
    <option>Pakistan +92</option>

    <option>Russia +7</option>
    <option> China+86</option>

    <input type="number" placeholder="Mob">
</select>
</p>

<p>Address: <textarea placeholder="address" cols="30" rows="5" id=""></textarea></p>

<fieldset>
    <legend id="gender">
        Gender
    </legend>
<p>
 Male: <input type="radio" placeholder="Gender" name="Gender"   id="">
 Female: <input type="radio" placeholder="Gender" name="Gender"  id="">
</p>
</fieldset>

    </form>
</body>
</html>
