<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
display: grid;
grid-template-columns:200px 200px 200PX;
grid-gap: 20px;
grid-auto-rows: 100px;



        }
        .items{
            background-color: lightcoral;
            border: 3px green solid;
            border-radius: 5px;
        }
        /* #item-2 {
        grid-row-start: 2;
        grid-row-end: 3;
        grid-column-start: 2;
        grid-column-end: 3;
        }  */
        #item-1{
            grid-column-start: 1;
            grid-column-end: 5;
        }
.item-1-container{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
}
.nested-item{
    border: 3px greenyellow solid ;
    border-radius: 3px;
    background-color: lightcoral;
}


    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1-container" id="item-1" >
            <div class="nested-item">Dabba mai Dabba 1</div>
            <div class="nested-item">Dabba mai Dabba 2</div>
            <div class="nested-item">Dabba mai Dabba 3</div>
        </div>
        <div class="items">Dabba 2</div>
        <div class="items">Dabba 3</div>
        <div class="items">Dabba 4</div>
        <div class="items">Dabba 5</div>
    </div>
</body>
</html>
