<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animatioms</title>
    <style>
        
        .gola{
width: 100px;
height: 100px;
background-color: red;
transition: width 2s ,height 4s,border-radius 4s, background 4s;
animation:750ms linear 250mas 2 reverse ;
        }
       
        .gola:hover{
     width: 300px;
     height: 300px;
     border-radius: 50%;
     background-color: green;
        } 
        a{
           padding-top: 0px;
        }
    </style>
</head>
<body>
   <div class="gola">
    <a>Rakesh</a></div>  
</body>
</html>
